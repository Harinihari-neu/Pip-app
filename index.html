<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E8F3EE">
<title>Pip · Focus Timer</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E8F3EE; --surface:#FFFFFF; --surface-2:#F4FAF7; --ink:#24352F; --ink-soft:#5E726B;
  --line:#D3E6DD; --focus:#FF7E98; --focus-soft:#FFE1E7; --break:#5DBFA8; --break-soft:#D5F1EA;
  --butter:#FFCF5C; --butter-soft:#FFF2CC; --leaf:#5DBF7A; --shadow:0 6px 0 #CFE3DA;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1B2230; --surface:#252E40; --surface-2:#2C3649; --ink:#F1F4F8; --ink-soft:#A9B3C4;
    --line:#38445A; --focus:#FF8DA4; --focus-soft:#4A2E3D; --break:#6ED1BA; --break-soft:#24453F;
    --butter:#FFD56E; --butter-soft:#4A4130; --leaf:#72CF8E; --shadow:0 6px 0 #141A25;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1B2230; --surface:#252E40; --surface-2:#2C3649; --ink:#F1F4F8; --ink-soft:#A9B3C4;
  --line:#38445A; --focus:#FF8DA4; --focus-soft:#4A2E3D; --break:#6ED1BA; --break-soft:#24453F;
  --butter:#FFD56E; --butter-soft:#4A4130; --leaf:#72CF8E; --shadow:0 6px 0 #141A25;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"Baloo 2",ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:17px;line-height:1.4;-webkit-tap-highlight-color:transparent;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.app{max-width:480px;margin:0 auto;padding:14px 18px 110px}
header.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.brand{font-weight:800;font-size:1.5rem;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.brand small{font-weight:600;font-size:.85rem;color:var(--ink-soft)}
.icon-btn{border:0;background:var(--surface);width:42px;height:42px;border-radius:14px;box-shadow:var(--shadow);font-size:1.2rem;display:grid;place-items:center}
.view{display:none}
.view.on{display:block}

/* mode pills */
.modes{display:flex;background:var(--surface);border-radius:999px;padding:5px;gap:4px;box-shadow:var(--shadow);margin:8px 0 18px}
.modes button{flex:1;border:0;background:transparent;border-radius:999px;padding:8px 4px;font-weight:700;font-size:.95rem;color:var(--ink-soft)}
.modes button[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink)}
body{--accent:var(--focus);--accent-soft:var(--focus-soft)}
body.is-break{--accent:var(--break);--accent-soft:var(--break-soft)}

/* timer */
.stage{position:relative;width:min(78vw,310px);aspect-ratio:1;margin:0 auto}
.stage svg.ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring .track{stroke:var(--surface)}
.ring .prog{stroke:var(--accent);transition:stroke-dashoffset .4s linear}
.pip{position:absolute;inset:16%;display:grid;place-items:center}
.pip svg{width:100%;height:100%;overflow:visible}
.time{text-align:center;font-weight:800;font-size:3.6rem;line-height:1;margin-top:12px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.sub{text-align:center;color:var(--ink-soft);font-weight:600;margin-top:4px;min-height:1.4em}
.dots{display:flex;justify-content:center;gap:7px;margin-top:6px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots i.done{background:var(--focus)}
.controls{display:flex;justify-content:center;align-items:center;gap:16px;margin:18px 0 10px}
.main-btn{border:0;background:var(--accent);color:#fff;font-weight:800;font-size:1.25rem;min-width:150px;padding:14px 26px;border-radius:22px;box-shadow:0 6px 0 color-mix(in srgb,var(--accent) 65%,#000)}
.main-btn:active{transform:translateY(4px);box-shadow:0 2px 0 color-mix(in srgb,var(--accent) 65%,#000)}
.round-btn{border:0;background:var(--surface);width:52px;height:52px;border-radius:50%;box-shadow:var(--shadow);font-size:1.25rem;display:grid;place-items:center}
.round-btn:active{transform:translateY(3px)}
.task-pick{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:18px;padding:10px 14px;box-shadow:var(--shadow);margin-top:14px}
.task-pick label{font-weight:700;color:var(--ink-soft);font-size:.9rem;white-space:nowrap}
.task-pick select{flex:1;border:0;background:var(--surface-2);border-radius:12px;padding:8px 10px;font-weight:700;min-width:0}
.today-strip{display:flex;gap:10px;margin-top:14px}
.chip{flex:1;background:var(--surface);border-radius:18px;padding:10px 12px;box-shadow:var(--shadow);text-align:center}
.chip b{display:block;font-size:1.35rem;font-weight:800;line-height:1.1}
.chip span{font-size:.82rem;color:var(--ink-soft);font-weight:600}

/* cards */
h2{font-size:1.45rem;font-weight:800;margin:6px 0 12px;letter-spacing:-.01em}
h3{font-size:1.08rem;font-weight:800;margin:0}
.card{background:var(--surface);border-radius:22px;padding:16px;box-shadow:var(--shadow);margin-bottom:16px}
.big-stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.big-stats .card{margin:0;padding:14px}
.big-stats b{font-size:1.8rem;font-weight:800;line-height:1;display:block}
.big-stats span{color:var(--ink-soft);font-weight:600;font-size:.88rem}
.big-stats .card:nth-child(1){background:var(--focus-soft)}
.big-stats .card:nth-child(2){background:var(--break-soft)}
.big-stats .card:nth-child(3){background:var(--butter-soft)}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--ink-soft);font-size:11px;font-weight:700;font-family:inherit}
.chart .val{fill:var(--ink)}
.row{display:flex;align-items:center;gap:10px;padding:8px 0}
.row + .row{border-top:2px dashed var(--line)}
.row .emo{font-size:1.4rem;width:34px;text-align:center}
.row .grow{flex:1;min-width:0}
.row .name{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.muted{color:var(--ink-soft);font-weight:600;font-size:.9rem}
.bar{height:12px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin-top:6px}
.bar > i{display:block;height:100%;background:var(--focus);border-radius:99px;transition:width .5s}
.bar.full > i{background:var(--leaf)}

/* goals */
.goal{border-radius:22px;padding:14px 16px;background:var(--surface);box-shadow:var(--shadow);margin-bottom:14px}
.goal-head{display:flex;align-items:center;gap:10px}
.goal-head .emo{font-size:1.7rem}
.goal-head .grow{flex:1;min-width:0}
.goal .reward{margin-top:10px;display:flex;align-items:center;gap:8px;background:var(--butter-soft);border-radius:14px;padding:8px 12px;font-weight:600;font-size:.95rem}
.goal .reward .grow{flex:1;min-width:0}
.claim{border:0;background:var(--butter);color:#3A2B00;font-weight:800;border-radius:12px;padding:6px 12px;box-shadow:0 4px 0 #D9A92F;white-space:nowrap}
.claim:active{transform:translateY(3px);box-shadow:0 1px 0 #D9A92F}
.claimed{font-weight:800;color:var(--leaf);white-space:nowrap}
.locked{white-space:nowrap;font-size:.9rem;color:var(--ink-soft);font-weight:700}
.tiny-btn{border:0;background:transparent;color:var(--ink-soft);font-weight:700;padding:4px 6px;border-radius:8px}
.add-btn{width:100%;border:2px dashed var(--line);background:transparent;border-radius:22px;padding:14px;font-weight:800;color:var(--ink-soft);font-size:1.05rem}
.empty{text-align:center;padding:22px 10px;color:var(--ink-soft);font-weight:600}
.empty .big{font-size:2.4rem;display:block}
.jar-item{display:flex;gap:10px;align-items:center;padding:7px 0}
.jar-item + .jar-item{border-top:2px dashed var(--line)}

/* forms */
.field{display:block;margin-bottom:12px}
.field > span{display:block;font-weight:700;font-size:.9rem;color:var(--ink-soft);margin-bottom:4px}
.field input,.field select{width:100%;border:2px solid var(--line);background:var(--surface-2);border-radius:14px;padding:10px 12px;font-weight:600}
.field input:focus,.field select:focus{border-color:var(--focus);outline:none}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.emoji-row{display:flex;flex-wrap:wrap;gap:6px}
.emoji-row button{border:2px solid var(--line);background:var(--surface-2);width:42px;height:42px;border-radius:12px;font-size:1.25rem}
.emoji-row button[aria-pressed="true"]{border-color:var(--focus);background:var(--focus-soft)}
.toggle{display:flex;align-items:center;justify-content:space-between;font-weight:700;margin-bottom:12px}
.toggle input{width:22px;height:22px;accent-color:var(--focus)}

/* sheet */
.sheet-wrap{position:fixed;inset:0;background:rgb(20 28 26 / .45);display:none;align-items:flex-end;justify-content:center;z-index:50}
.sheet-wrap.on{display:flex}
.sheet{background:var(--surface);width:100%;max-width:480px;border-radius:28px 28px 0 0;padding:18px 18px calc(20px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto;animation:up .22s ease-out}
.sheet .grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.sheet-actions{display:flex;gap:10px;margin-top:6px}
.sheet-actions button{flex:1;border:0;border-radius:16px;padding:12px;font-weight:800}
.btn-primary{background:var(--focus);color:#fff;box-shadow:0 5px 0 color-mix(in srgb,var(--focus) 65%,#000)}
.btn-ghost{background:var(--surface-2)}
.btn-danger{background:transparent;color:#D9536E;border:2px solid var(--line)!important}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}

/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:8px 14px calc(10px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:20}
nav.tabs .inner{display:flex;gap:6px;background:var(--surface);padding:6px;border-radius:24px;box-shadow:var(--shadow);width:100%;max-width:420px}
nav.tabs button{flex:1;border:0;background:transparent;border-radius:18px;padding:6px 4px;font-weight:700;font-size:.82rem;color:var(--ink-soft);display:flex;flex-direction:column;align-items:center;gap:0}
nav.tabs button .ic{font-size:1.3rem;line-height:1.2}
nav.tabs button[aria-current="page"]{background:var(--focus-soft);color:var(--ink)}

.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translate(-50%,-140%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:16px;font-weight:700;z-index:60;transition:transform .3s;max-width:90vw;text-align:center}
.toast.on{transform:translate(-50%,0)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:70}

/* mascot moods */
.eye-open,.eye-closed,.eye-focus{transition:opacity .2s}
.pip[data-mood="idle"] .eye-closed,.pip[data-mood="idle"] .eye-focus{opacity:0}
.pip[data-mood="focus"] .eye-open,.pip[data-mood="focus"] .eye-closed{opacity:0}
.pip[data-mood="break"] .eye-open,.pip[data-mood="break"] .eye-focus{opacity:0}
.pip[data-mood="idle"] .eye-open{animation:blink 4.5s infinite;transform-origin:center 92px;transform-box:view-box}
.pip[data-mood="focus"] .body-g{animation:bob 2.4s ease-in-out infinite}
.pip[data-mood="break"] .zz{opacity:1}
.zz{opacity:0;transition:opacity .3s;font-weight:800;fill:var(--break)}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">🍅 Pip <small>focus buddy</small></div>
    <button class="icon-btn" id="settingsBtn" aria-label="Timer settings">⚙️</button>
  </header>

  <!-- TIMER -->
  <section class="view on" id="v-timer" aria-label="Timer">
    <div class="modes" role="group" aria-label="Session type">
      <button data-mode="focus" aria-pressed="true">Study</button>
      <button data-mode="short" aria-pressed="false">Short break</button>
      <button data-mode="long" aria-pressed="false">Long break</button>
    </div>

    <div class="stage">
      <svg class="ring" viewBox="0 0 200 200" aria-hidden="true">
        <circle class="track" cx="100" cy="100" r="92" fill="none" stroke-width="12"/>
        <circle class="prog" id="prog" cx="100" cy="100" r="92" fill="none" stroke-width="12" stroke-linecap="round" stroke-dasharray="578" stroke-dashoffset="0"/>
      </svg>
      <div class="pip" id="pip" data-mood="idle" aria-hidden="true">
        <svg viewBox="0 0 160 160">
          <g class="body-g">
            <ellipse cx="80" cy="96" rx="58" ry="52" fill="#FF7E86"/>
            <ellipse cx="62" cy="76" rx="14" ry="9" fill="#FFB3B8" opacity=".8"/>
            <path d="M80 48 C70 34 58 36 52 40 C64 44 70 48 74 52 Z" fill="var(--leaf)"/>
            <path d="M80 48 C92 32 104 36 110 40 C98 44 90 48 86 52 Z" fill="var(--leaf)"/>
            <rect x="77" y="30" width="6" height="20" rx="3" fill="var(--leaf)"/>
            <g class="eye-open" fill="#2A1A1E">
              <ellipse cx="62" cy="92" rx="6" ry="8"/><ellipse cx="98" cy="92" rx="6" ry="8"/>
              <circle cx="64" cy="89" r="2" fill="#fff"/><circle cx="100" cy="89" r="2" fill="#fff"/>
            </g>
            <g class="eye-focus" stroke="#2A1A1E" stroke-width="4" stroke-linecap="round" fill="none">
              <path d="M54 88 L70 92"/><path d="M106 88 L90 92"/>
              <circle cx="63" cy="97" r="3.5" fill="#2A1A1E" stroke="none"/><circle cx="97" cy="97" r="3.5" fill="#2A1A1E" stroke="none"/>
            </g>
            <g class="eye-closed" stroke="#2A1A1E" stroke-width="4" stroke-linecap="round" fill="none">
              <path d="M54 93 Q62 99 70 93"/><path d="M90 93 Q98 99 106 93"/>
            </g>
            <ellipse cx="48" cy="108" rx="8" ry="5" fill="#FF5C78" opacity=".55"/>
            <ellipse cx="112" cy="108" rx="8" ry="5" fill="#FF5C78" opacity=".55"/>
            <path d="M72 110 Q80 117 88 110" stroke="#2A1A1E" stroke-width="3.5" fill="none" stroke-linecap="round"/>
          </g>
          <text class="zz" x="122" y="50" font-size="18">z</text>
          <text class="zz" x="134" y="34" font-size="13">z</text>
        </svg>
      </div>
    </div>
    <div class="time" id="time" aria-live="off">25:00</div>
    <div class="sub" id="sub">Ready when you are</div>
    <div class="dots" id="dots" aria-label="Sessions until long break"></div>

    <div class="controls">
      <button class="round-btn" id="resetBtn" aria-label="Reset timer">↺</button>
      <button class="main-btn" id="startBtn">Start</button>
      <button class="round-btn" id="skipBtn" aria-label="Finish and skip to next">⏭</button>
    </div>

    <div class="task-pick">
      <label for="taskSel">Studying</label>
      <select id="taskSel"></select>
    </div>

    <div class="today-strip">
      <div class="chip"><b id="todayHrs">0h</b><span>today</span></div>
      <div class="chip"><b id="todaySess">0</b><span>sessions</span></div>
      <div class="chip"><b id="streak">0</b><span>day streak</span></div>
    </div>
  </section>

  <!-- STATS -->
  <section class="view" id="v-stats" aria-label="Stats">
    <h2>Your productivity</h2>
    <div class="big-stats">
      <div class="card"><b id="sToday">0h</b><span>today</span></div>
      <div class="card"><b id="sWeek">0h</b><span>this week</span></div>
      <div class="card"><b id="sAll">0h</b><span>all time</span></div>
      <div class="card"><b id="sCount">0</b><span>sessions done</span></div>
    </div>
    <div class="card chart">
      <h3>Last 7 days</h3>
      <div id="chart"></div>
    </div>
    <div class="card">
      <h3>Time by task this week</h3>
      <div id="byTask"></div>
    </div>
  </section>

  <!-- GOALS -->
  <section class="view" id="v-goals" aria-label="Goals and rewards">
    <h2>Goals & rewards</h2>
    <div id="goalList"></div>
    <button class="add-btn" id="addGoal">＋ Add a task goal</button>
    <div class="card" style="margin-top:18px">
      <h3>🫙 Reward jar</h3>
      <div id="jar"></div>
    </div>
  </section>
</div>

<nav class="tabs" aria-label="Main">
  <div class="inner">
    <button data-tab="timer" aria-current="page"><span class="ic">⏱️</span>Timer</button>
    <button data-tab="stats"><span class="ic">📊</span>Stats</button>
    <button data-tab="goals"><span class="ic">🎁</span>Goals</button>
  </div>
</nav>

<!-- goal sheet -->
<div class="sheet-wrap" id="goalSheet" role="dialog" aria-modal="true" aria-labelledby="goalSheetTitle">
  <div class="sheet">
    <div class="grab"></div>
    <h2 id="goalSheetTitle">New goal</h2>
    <label class="field"><span>Task name</span><input id="gName" maxlength="40" placeholder="e.g. Algorithms practice"></label>
    <div class="field"><span>Pick an icon</span><div class="emoji-row" id="gEmoji"></div></div>
    <div class="two">
      <label class="field"><span>Target hours</span><input id="gHours" type="number" min="0.5" step="0.5" inputmode="decimal" value="5"></label>
      <label class="field"><span>Every</span>
        <select id="gPeriod"><option value="day">Day</option><option value="week" selected>Week</option><option value="total">Once (total)</option></select>
      </label>
    </div>
    <label class="field"><span>Reward when you hit it</span><input id="gReward" maxlength="60" placeholder="e.g. Bubble tea 🧋"></label>
    <div class="sheet-actions">
      <button class="btn-danger" id="gDelete" hidden>Delete</button>
      <button class="btn-ghost" id="gCancel">Cancel</button>
      <button class="btn-primary" id="gSave">Save goal</button>
    </div>
  </div>
</div>

<!-- settings sheet -->
<div class="sheet-wrap" id="setSheet" role="dialog" aria-modal="true" aria-labelledby="setTitle">
  <div class="sheet">
    <div class="grab"></div>
    <h2 id="setTitle">Timer settings</h2>
    <div class="two">
      <label class="field"><span>Study (min)</span><input id="sFocus" type="number" min="1" max="180" inputmode="numeric"></label>
      <label class="field"><span>Short break (min)</span><input id="sShort" type="number" min="1" max="60" inputmode="numeric"></label>
      <label class="field"><span>Long break (min)</span><input id="sLong" type="number" min="1" max="90" inputmode="numeric"></label>
      <label class="field"><span>Long break after</span><input id="sEvery" type="number" min="2" max="10" inputmode="numeric"></label>
    </div>
    <label class="toggle">Sound when time’s up <input type="checkbox" id="sSound"></label>
    <label class="toggle">Vibrate when time’s up <input type="checkbox" id="sVibe"></label>
    <label class="toggle">Auto-start the next session <input type="checkbox" id="sAuto"></label>
    <div class="sheet-actions">
      <button class="btn-ghost" id="sCancel">Cancel</button>
      <button class="btn-primary" id="sSave">Save</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>
<canvas id="confetti"></canvas>

<script>
(function(){
"use strict";
const LS_STATE="pip-state-v1", LS_TIMER="pip-timer-v1";
const EMOJIS=["📚","💻","🧮","🔐","✍️","🧪","🎨","🗣️","🎹","🏃","🧠","📈"];
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];

function defaultState(){return{v:1,settings:{focus:25,short:5,long:15,every:4,sound:true,vibe:true,auto:false},tasks:[],sessions:[],claims:[],cycle:0,lastTask:"",updatedAt:0}}
function lsGet(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}

let state=Object.assign(defaultState(),lsGet(LS_STATE)||{});
state.settings=Object.assign(defaultState().settings,state.settings||{});
let timer=lsGet(LS_TIMER)||null;

/* ---------- persistence (on this device) ---------- */
function save(){state.updatedAt=Date.now();lsSet(LS_STATE,state)}

/* ---------- date helpers ---------- */
const DAY=864e5;
function dayKey(t){const d=new Date(t);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function startOfDay(t){const d=new Date(t);d.setHours(0,0,0,0);return d.getTime()}
function startOfWeek(t){const d=new Date(startOfDay(t));const wd=(d.getDay()+6)%7;d.setDate(d.getDate()-wd);return d.getTime()}
function periodKey(p,t){return p==="day"?"d"+dayKey(t):p==="week"?"w"+dayKey(startOfWeek(t)):"all"}
function periodStart(p,t){return p==="day"?startOfDay(t):p==="week"?startOfWeek(t):0}
function fmtH(min){if(min<60)return Math.round(min)+"m";const h=min/60;return(h>=10?Math.round(h):Math.round(h*10)/10)+"h"}
function minsSince(from,taskId){let m=0;for(const s of state.sessions){if(s.t>=from&&(taskId===undefined||s.task===taskId))m+=s.m}return m}

/* ---------- timer ---------- */
const modeMin=m=>m==="focus"?state.settings.focus:m==="short"?state.settings.short:state.settings.long;
function freshTimer(mode){return{mode,running:false,endAt:0,remain:modeMin(mode)*60000,total:modeMin(mode)*60000,startedAt:0}}
if(!timer||!timer.mode)timer=freshTimer("focus");
function saveTimer(){lsSet(LS_TIMER,timer)}
function remaining(){return timer.running?Math.max(0,timer.endAt-Date.now()):timer.remain}

function setMode(mode,keep){
  if(timer.running&&!keep)return;
  timer=freshTimer(mode);saveTimer();renderTimer();
}
function start(){
  unlockAudio();askNotif();
  if(timer.running){ // pause
    timer.remain=remaining();timer.running=false;
  }else{
    timer.endAt=Date.now()+timer.remain;timer.running=true;
    if(!timer.startedAt)timer.startedAt=Date.now();
    if(timer.mode==="focus")timer.task=$("#taskSel").value||"";
  }
  saveTimer();renderTimer();
}
function reset(){timer=freshTimer(timer.mode);saveTimer();renderTimer()}
function logFocus(ms,when){
  const m=Math.round(ms/60000*10)/10;
  if(m<1)return 0;
  state.sessions.push({t:when||Date.now(),m,task:timer.task||state.lastTask||""});
  return m;
}
function complete(early){
  const wasMode=timer.mode;
  let msg="";
  if(wasMode==="focus"){
    const done=timer.total-remaining();
    const m=logFocus(early?done:timer.total,early?Date.now():timer.endAt);
    if(!early||m>=1)state.cycle=(state.cycle||0)+(early?0:1);
    save();
    msg=early?(m>=1?"Logged "+fmtH(m)+" of study 🌱":"Under a minute, not logged"):"Session done! Time for a break 🍵";
    checkGoalsUnlocked();
  }else msg="Break’s over, let’s go 💪";
  if(!early)notify(wasMode==="focus"?"Study session done 🍅":"Break’s over 💪",wasMode==="focus"?"Time for a break.":"Ready for the next session?");
  if(!early){chime();if(state.settings.vibe&&navigator.vibrate)try{navigator.vibrate([200,100,200])}catch(e){}}
  let next="focus";
  if(wasMode==="focus")next=(state.cycle>0&&state.cycle%state.settings.every===0&&!early)?"long":"short";
  timer=freshTimer(next);
  if(state.settings.auto&&!early){timer.endAt=Date.now()+timer.remain;timer.running=true;timer.startedAt=Date.now();if(next==="focus")timer.task=state.lastTask}
  saveTimer();toast(msg);renderAll();
}
function tick(){
  if(timer.running&&remaining()<=0){complete(false);return}
  renderTime();
}
setInterval(tick,250);
document.addEventListener("visibilitychange",tick);

/* notifications */
let askedNotif=false;
function askNotif(){if(askedNotif||!("Notification" in window))return;askedNotif=true;if(Notification.permission==="default")try{Notification.requestPermission()}catch(e){}}
function notify(title,body){
  try{
    if(!("Notification" in window)||Notification.permission!=="granted"||document.visibilityState==="visible")return;
    navigator.serviceWorker&&navigator.serviceWorker.ready.then(r=>r.showNotification(title,{body,icon:"icon-192.png",badge:"icon-192.png",vibrate:[200,100,200],tag:"pip"}));
  }catch(e){}
}
/* sound */
let ac=null;
function unlockAudio(){try{if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();if(ac.state==="suspended")ac.resume()}catch(e){}}
function chime(){
  if(!state.settings.sound||!ac)return;
  try{
    [659.25,783.99,1046.5].forEach((f,i)=>{
      const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+i*.18;
      o.type="sine";o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.25,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.5);
      o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+.55);
    });
  }catch(e){}
}

/* ---------- rendering ---------- */
function renderTime(){
  const r=remaining(),s=Math.ceil(r/1000);
  const txt=String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
  $("#time").textContent=txt;
  const frac=timer.total?1-r/timer.total:0;
  $("#prog").style.strokeDashoffset=String(578*(1-frac));
  document.title=timer.running?txt+" · "+(timer.mode==="focus"?"Study":"Break"):"Pip · Focus Timer";
}
function renderTimer(){
  const isBreak=timer.mode!=="focus";
  document.body.classList.toggle("is-break",isBreak);
  $$(".modes button").forEach(b=>{b.setAttribute("aria-pressed",String(b.dataset.mode===timer.mode));b.disabled=timer.running&&b.dataset.mode!==timer.mode});
  $("#pip").dataset.mood=timer.running?(isBreak?"break":"focus"):"idle";
  const started=timer.remain<timer.total||timer.running;
  $("#startBtn").textContent=timer.running?"Pause":started?"Resume":"Start";
  const task=state.tasks.find(t=>t.id===(timer.running?timer.task:$("#taskSel").value));
  $("#sub").textContent=timer.running?(isBreak?"Rest your eyes, stretch a little":(task?task.emoji+" Focusing on "+task.name:"Deep focus mode")):started?"Paused":(isBreak?"Break time":"Ready when you are");
  $("#taskSel").disabled=timer.running&&!isBreak;
  const every=state.settings.every,done=(state.cycle||0)%every;
  $("#dots").innerHTML=Array.from({length:every},(_,i)=>`<i class="${i<done?"done":""}"></i>`).join("");
  renderTime();
}
function renderTaskSelect(){
  const sel=$("#taskSel");
  const cur=timer.running&&timer.mode==="focus"?timer.task:(state.lastTask||"");
  sel.innerHTML=`<option value="">✨ General study</option>`+state.tasks.map(t=>`<option value="${t.id}">${t.emoji} ${esc(t.name)}</option>`).join("");
  sel.value=state.tasks.some(t=>t.id===cur)?cur:"";
}
function streakDays(){
  const days=new Set(state.sessions.map(s=>dayKey(s.t)));
  let n=0,t=Date.now();
  if(!days.has(dayKey(t)))t-=DAY;
  while(days.has(dayKey(t))){n++;t=startOfDay(t)-DAY/2}
  return n;
}
function renderToday(){
  const now=Date.now(),sod=startOfDay(now);
  $("#todayHrs").textContent=fmtH(minsSince(sod));
  $("#todaySess").textContent=state.sessions.filter(s=>s.t>=sod).length;
  $("#streak").textContent=streakDays();
}
function renderStats(){
  const now=Date.now();
  $("#sToday").textContent=fmtH(minsSince(startOfDay(now)));
  $("#sWeek").textContent=fmtH(minsSince(startOfWeek(now)));
  $("#sAll").textContent=fmtH(minsSince(0));
  $("#sCount").textContent=state.sessions.length;
  // chart
  const days=[];for(let i=6;i>=0;i--){const st=startOfDay(now)-i*DAY+DAY/2;days.push(startOfDay(st))}
  const vals=days.map(d=>{const k=dayKey(d);let m=0;for(const s of state.sessions)if(dayKey(s.t)===k)m+=s.m;return m});
  const max=Math.max(60,...vals),W=320,H=150,bw=28,gap=(W-7*bw)/8;
  const names=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  let svg=`<svg viewBox="0 0 ${W} ${H+30}" role="img" aria-label="Study time over the last 7 days">`;
  vals.forEach((v,i)=>{
    const h=Math.max(4,(v/max)*(H-22)),x=gap+i*(bw+gap),y=H-h,today=i===6;
    svg+=`<rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="9" fill="${today?"var(--focus)":v?"var(--break)":"var(--surface-2)"}"/>`;
    if(v)svg+=`<text class="val" x="${x+bw/2}" y="${y-6}" text-anchor="middle">${fmtH(v)}</text>`;
    svg+=`<text x="${x+bw/2}" y="${H+20}" text-anchor="middle">${today?"Today":names[new Date(days[i]).getDay()]}</text>`;
  });
  $("#chart").innerHTML=svg+"</svg>";
  // by task
  const wk=startOfWeek(now),rows=[{id:"",name:"General study",emoji:"✨"},...state.tasks]
    .map(t=>({t,m:minsSince(wk,t.id)})).filter(r=>r.m>0).sort((a,b)=>b.m-a.m);
  const top=rows.length?rows[0].m:1;
  $("#byTask").innerHTML=rows.length?rows.map(r=>`<div class="row"><div class="emo">${r.t.emoji}</div><div class="grow"><div class="name">${esc(r.t.name)}</div><div class="bar"><i style="width:${r.m/top*100}%"></i></div></div><div class="muted">${fmtH(r.m)}</div></div>`).join("")
    :`<div class="empty"><span class="big">🌱</span>Finish a study session and it shows up here.</div>`;
}
function goalProgress(g){const now=Date.now();return minsSince(periodStart(g.period,now),g.id)}
function renderGoals(){
  const per={day:"today",week:"this week",total:"in total"};
  const list=$("#goalList");
  if(!state.tasks.length){list.innerHTML=`<div class="card empty"><span class="big">🎯</span>Add a task, set how many hours you want to put in, and pick a treat for when you get there.</div>`}
  else list.innerHTML=state.tasks.map(g=>{
    const m=goalProgress(g),target=g.target*60,pct=Math.min(100,m/target*100),full=m>=target;
    const key=periodKey(g.period,Date.now()),claimed=(g.claimed||[]).includes(key);
    let act=claimed?`<span class="claimed">✓ Claimed</span>`:full?`<button class="claim" data-claim="${g.id}">Claim</button>`:`<span class="locked">🔒 ${fmtH(target-m)} to go</span>`;
    return `<div class="goal"><div class="goal-head"><div class="emo">${g.emoji}</div><div class="grow"><h3>${esc(g.name)}</h3><div class="muted">${fmtH(m)} of ${g.target}h ${per[g.period]}</div></div><button class="tiny-btn" data-edit="${g.id}" aria-label="Edit ${esc(g.name)}">Edit</button></div>
      <div class="bar ${full?"full":""}"><i style="width:${pct}%"></i></div>
      ${g.reward?`<div class="reward"><span>🎁</span><span class="grow">${esc(g.reward)}</span>${act}</div>`:""}</div>`;
  }).join("");
  const claims=state.claims.slice(-12).reverse();
  $("#jar").innerHTML=claims.length?claims.map(c=>`<div class="jar-item"><span style="font-size:1.3rem">${c.emoji||"🎁"}</span><div class="grow"><div style="font-weight:700">${esc(c.reward)}</div><div class="muted">${esc(c.name)} · ${new Date(c.at).toLocaleDateString(undefined,{month:"short",day:"numeric"})}</div></div></div>`).join("")
    :`<div class="empty" style="padding:12px">Rewards you claim are collected here.</div>`;
}
function renderAll(){renderTaskSelect();renderTimer();renderToday();renderStats();renderGoals()}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}

/* goals unlocked notice */
function checkGoalsUnlocked(){
  for(const g of state.tasks){
    if(!g.reward)continue;
    const key=periodKey(g.period,Date.now());
    if((g.claimed||[]).includes(key)||(g.notified===key))continue;
    if(goalProgress(g)>=g.target*60){g.notified=key;save();setTimeout(()=>{toast("🎉 Goal hit: "+g.name+"! Claim your reward");confetti()},600)}
  }
}

/* ---------- toast & confetti ---------- */
let toastT;
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("on"),2800)}
function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const c=$("#confetti"),x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;
  const cols=["#FF7E98","#5DBFA8","#FFCF5C","#9AB8FF","#5DBF7A"];
  const ps=Array.from({length:90},()=>({x:innerWidth/2,y:innerHeight*.4,vx:(Math.random()-.5)*12,vy:-Math.random()*12-4,r:Math.random()*6+4,c:cols[Math.random()*5|0],a:Math.random()*6}));
  let f=0;(function draw(){x.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.a+=.2;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore()});if(++f<110)requestAnimationFrame(draw);else x.clearRect(0,0,c.width,c.height)})();
}

/* ---------- goal sheet ---------- */
let editing=null,pickedEmoji=EMOJIS[0];
function openGoal(id){
  editing=id?state.tasks.find(t=>t.id===id):null;
  $("#goalSheetTitle").textContent=editing?"Edit goal":"New goal";
  $("#gName").value=editing?editing.name:"";
  $("#gHours").value=editing?editing.target:5;
  $("#gPeriod").value=editing?editing.period:"week";
  $("#gReward").value=editing?editing.reward:"";
  pickedEmoji=editing?editing.emoji:EMOJIS[state.tasks.length%EMOJIS.length];
  $("#gDelete").hidden=!editing;
  renderEmojis();$("#goalSheet").classList.add("on");setTimeout(()=>$("#gName").focus(),50);
}
function renderEmojis(){$("#gEmoji").innerHTML=EMOJIS.map(e=>`<button type="button" aria-pressed="${e===pickedEmoji}" data-emo="${e}">${e}</button>`).join("")}
$("#gEmoji").addEventListener("click",e=>{const b=e.target.closest("[data-emo]");if(b){pickedEmoji=b.dataset.emo;renderEmojis()}});
$("#gSave").addEventListener("click",()=>{
  const name=$("#gName").value.trim(),target=parseFloat($("#gHours").value);
  if(!name){toast("Give the task a name");return}
  if(!(target>0)){toast("Set a target above 0 hours");return}
  const data={name,target:Math.round(target*10)/10,period:$("#gPeriod").value,reward:$("#gReward").value.trim(),emoji:pickedEmoji};
  if(editing)Object.assign(editing,data);
  else state.tasks.push(Object.assign({id:"t"+Date.now().toString(36),claimed:[]},data));
  save();closeSheets();renderAll();toast(editing?"Goal updated":"Goal added 🎯");
});
$("#gDelete").addEventListener("click",()=>{
  if(!editing||!confirm("Delete “"+editing.name+"”? Its logged hours move to General study."))return;
  const id=editing.id;state.tasks=state.tasks.filter(t=>t.id!==id);
  state.sessions.forEach(s=>{if(s.task===id)s.task=""});
  if(state.lastTask===id)state.lastTask="";
  save();closeSheets();renderAll();
});
$("#gCancel").addEventListener("click",closeSheets);
$("#addGoal").addEventListener("click",()=>openGoal(null));
$("#goalList").addEventListener("click",e=>{
  const ed=e.target.closest("[data-edit]");if(ed){openGoal(ed.dataset.edit);return}
  const cl=e.target.closest("[data-claim]");
  if(cl){const g=state.tasks.find(t=>t.id===cl.dataset.claim);if(!g)return;
    const key=periodKey(g.period,Date.now());g.claimed=(g.claimed||[]).slice(-20);g.claimed.push(key);
    state.claims.push({name:g.name,reward:g.reward,emoji:g.emoji,at:Date.now()});state.claims=state.claims.slice(-50);
    save();renderGoals();confetti();toast("Enjoy it, you earned it! 🎉")}
});

/* ---------- settings sheet ---------- */
function openSettings(){
  const s=state.settings;$("#sFocus").value=s.focus;$("#sShort").value=s.short;$("#sLong").value=s.long;$("#sEvery").value=s.every;
  $("#sSound").checked=s.sound;$("#sVibe").checked=s.vibe;$("#sAuto").checked=s.auto;$("#setSheet").classList.add("on");
}
const clamp=(v,a,b,d)=>{v=parseInt(v,10);return isNaN(v)?d:Math.min(b,Math.max(a,v))};
$("#sSave").addEventListener("click",()=>{
  const s=state.settings;
  s.focus=clamp($("#sFocus").value,1,180,25);s.short=clamp($("#sShort").value,1,60,5);s.long=clamp($("#sLong").value,1,90,15);s.every=clamp($("#sEvery").value,2,10,4);
  s.sound=$("#sSound").checked;s.vibe=$("#sVibe").checked;s.auto=$("#sAuto").checked;
  save();if(!timer.running&&timer.remain===timer.total)timer=freshTimer(timer.mode);saveTimer();closeSheets();renderAll();toast("Settings saved");
});
$("#sCancel").addEventListener("click",closeSheets);
$("#settingsBtn").addEventListener("click",openSettings);
function closeSheets(){$$(".sheet-wrap").forEach(s=>s.classList.remove("on"))}
$$(".sheet-wrap").forEach(w=>w.addEventListener("click",e=>{if(e.target===w)closeSheets()}));
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheets()});

/* ---------- wiring ---------- */
$$(".modes button").forEach(b=>b.addEventListener("click",()=>setMode(b.dataset.mode)));
$("#startBtn").addEventListener("click",start);
$("#resetBtn").addEventListener("click",reset);
$("#skipBtn").addEventListener("click",()=>{if(timer.mode==="focus"&&timer.remain===timer.total&&!timer.running){setMode("short");return}complete(true)});
$("#taskSel").addEventListener("change",e=>{state.lastTask=e.target.value;save();renderTimer()});
function showTab(name){
  $$(".view").forEach(v=>v.classList.toggle("on",v.id==="v-"+name));
  $$("nav.tabs button").forEach(b=>{if(b.dataset.tab===name)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")});
  if(name==="stats")renderStats();if(name==="goals")renderGoals();
  scrollTo(0,0);
}
$$("nav.tabs button").forEach(b=>b.addEventListener("click",()=>{location.hash=b.dataset.tab==="timer"?"":b.dataset.tab;showTab(b.dataset.tab)}));
addEventListener("hashchange",()=>showTab(["stats","goals"].includes(location.hash.slice(1))?location.hash.slice(1):"timer"));

if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
renderAll();
showTab(["stats","goals"].includes(location.hash.slice(1))?location.hash.slice(1):"timer");
})();
</script>
</body>
</html>
